<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competency Architect · WSU Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --ink-2:#20242A; --ink-3:#2E343C;
  --paper:#EDF0EA; --card:#FFFFFF; --card-2:#F7F9F5;
  --signal:#FFC72C; --signal-dim:#E0A800;
  --slate:#5A636B; --slate-2:#828C93;
  --rule:#CDD3C9; --rule-2:#E2E6DE;
  --K:#1D5B8E; --S:#0F7A69; --A:#99560F; --B:#6E3A78;
  --bad:#B32B23; --warn:#9A6205; --ok:#186B3F;
  --d:'Archivo',system-ui,sans-serif;
  --b:'Public Sans',system-ui,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,monospace;
  --sp:clamp(14px,2vw,22px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--b);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3,h4{margin:0;font-family:var(--d);font-weight:700;letter-spacing:-.015em;line-height:1.15}
a{color:var(--K)}

/* ---------- structural motif: the marker bar ---------- */
.bar{display:block;height:4px;width:34px;background:var(--signal);border-radius:1px}

/* ---------- chrome ---------- */
.chrome{background:var(--ink);color:#fff;position:sticky;top:0;z-index:40}
.chrome-in{max-width:1560px;margin:0 auto;padding:14px var(--sp);display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand .mark{width:8px;height:34px;background:var(--signal);border-radius:1px;flex:none}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.02em;text-transform:uppercase}
.brand p{margin:1px 0 0;font-family:var(--m);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:#9AA3AB}

.seg{display:flex;background:var(--ink-3);border-radius:3px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{
  font-family:var(--d);font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:7px 13px;border-radius:2px;color:#B7BEC5;white-space:nowrap;
}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:var(--signal);color:var(--ink)}
.seg.sm button{font-size:11px;padding:6px 11px}
.track-wrap{display:flex;align-items:center;gap:9px}
.track-wrap[hidden]{display:none}
[hidden]{display:none!important}
.track-wrap .lbl{font-family:var(--m);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#7D868E}

/* ---------- program band ---------- */
.band{background:var(--ink-2);color:#fff;border-top:1px solid #33393F}
.band-in{max-width:1560px;margin:0 auto;padding:16px var(--sp) 18px;display:grid;gap:16px 34px;grid-template-columns:minmax(260px,1.4fr) repeat(auto-fit,minmax(190px,1fr))}
.band h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.band .cred{font-family:var(--m);font-size:11px;color:var(--signal);letter-spacing:.06em;margin-top:5px}
.band .site{font-size:12.5px;color:#9AA3AB;margin-top:3px}
.meta-h{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#78818A;margin-bottom:6px}
.meta-l{font-size:12.5px;color:#D3D8DD;line-height:1.55}
.meta-l span{display:block}

/* ---------- view tabs ---------- */
.tabs{background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:30}
.tabs-in{max-width:1560px;margin:0 auto;padding:0 var(--sp);display:flex;gap:2px;overflow-x:auto}
.tabs button{
  font-family:var(--d);font-size:12.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  padding:14px 16px;color:var(--slate);border-bottom:3px solid transparent;white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tabs .count{font-family:var(--m);font-size:10px;margin-left:6px;padding:2px 5px;border-radius:2px;background:var(--paper);color:var(--slate)}
.tabs .count.flag{background:#FBE3E1;color:var(--bad)}

/* ---------- layout ---------- */
main{max-width:1560px;margin:0 auto;padding:var(--sp)}
.build{display:grid;grid-template-columns:302px minmax(0,1fr);gap:var(--sp);align-items:start}

/* ---------- tree ---------- */
.tree{background:var(--card);border:1px solid var(--rule);border-radius:4px;position:sticky;top:56px;max-height:calc(100vh - 76px);overflow:auto}
.tree-h{padding:13px 14px 11px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;justify-content:space-between;gap:8px}
.tree-h .t{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.dom{border-bottom:1px solid var(--rule-2)}
.dom:last-child{border-bottom:none}
.dom-btn{width:100%;text-align:left;padding:11px 14px;display:flex;gap:9px;align-items:baseline}
.dom-btn:hover{background:var(--card-2)}
.dom-btn.on{background:#FFF8E2;box-shadow:inset 3px 0 0 var(--signal)}
.dom-btn .id{font-family:var(--m);font-size:10.5px;color:var(--slate-2);flex:none}
.dom-btn .nm{font-family:var(--d);font-size:13px;font-weight:600;letter-spacing:-.005em}
.comp-btn{width:100%;text-align:left;padding:8px 14px 8px 32px;display:flex;gap:9px;align-items:baseline;border-top:1px solid #F1F3EF}
.comp-btn:hover{background:var(--card-2)}
.comp-btn.on{background:var(--ink);color:#fff}
.comp-btn.on .id{color:var(--signal)}
.comp-btn .id{font-family:var(--m);font-size:10.5px;color:var(--slate-2);flex:none}
.comp-btn .nm{font-size:12.5px;line-height:1.35}
.comp-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--bad);flex:none;margin-left:auto;align-self:center}
.comp-add{
  width:100%;text-align:left;padding:8px 14px 9px 32px;border-top:1px solid #F1F3EF;
  font-family:var(--m);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate-2);
}
.comp-add:hover{background:#FFF8E2;color:var(--ink);box-shadow:inset 3px 0 0 var(--signal)}
.comp-btn .nm.untitled{color:var(--slate-2);font-style:italic}
.tree-add{width:100%;padding:11px 14px;text-align:left;font-family:var(--m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);border-top:1px solid var(--rule-2)}
.tree-add:hover{background:var(--card-2);color:var(--ink)}

/* ---------- panel / cards ---------- */
.panel{display:flex;flex-direction:column;gap:var(--sp);min-width:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:4px}
.card-h{padding:15px 18px 13px;border-bottom:1px solid var(--rule-2);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card-h .sub{font-size:12px;color:var(--slate);margin-left:auto}
.card-b{padding:18px}
.cben-tag{
  font-family:var(--m);font-size:9.5px;letter-spacing:.08em;padding:3px 6px;border-radius:2px;
  background:var(--paper);color:var(--slate);border:1px solid var(--rule-2);cursor:help;
}

/* ---------- forms ---------- */
label.f{display:block}
label.f>.lh{font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-bottom:5px;display:block}
input[type=text],input[type=number],textarea,select{
  width:100%;background:var(--card-2);border:1px solid var(--rule-2);border-radius:3px;
  padding:8px 10px;font-size:13.5px;line-height:1.45;transition:border-color .12s,background .12s;
}
input[type=text]:focus,textarea:focus,select:focus,input[type=number]:focus{
  outline:none;border-color:var(--ink);background:#fff;box-shadow:0 0 0 3px rgba(255,199,44,.35)
}
textarea{resize:vertical;min-height:62px;font-family:var(--b)}
select{cursor:pointer}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stmt-grid{display:grid;grid-template-columns:120px 1fr;gap:12px 14px;align-items:start}
@media(max-width:640px){.stmt-grid{grid-template-columns:1fr}}
.readout{
  background:var(--ink);color:#fff;border-radius:3px;padding:15px 17px;margin-top:16px;
  font-size:15px;line-height:1.6;
}
.readout .v{color:var(--signal);font-weight:600}
.readout .c{color:#A9D8CE}
.readout .cr{color:#FFD9A8}
.readout .rh{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#78818A;display:block;margin-bottom:8px}

/* ---------- record bar ---------- */
.rec{
  display:grid;grid-template-columns:150px minmax(180px,1fr) auto;gap:14px;align-items:end;
  padding:14px 18px;background:var(--card-2);border-bottom:1px solid var(--rule-2);
}
@media(max-width:760px){.rec{grid-template-columns:1fr}}
.rec #sId{font-family:var(--m);font-size:12.5px;font-weight:500}
.rec input.bad{border-color:var(--bad);background:#FEF4F3;box-shadow:0 0 0 3px rgba(179,43,35,.14)}
.rec label.f{position:relative}
.ferr{
  position:absolute;top:calc(100% + 5px);left:0;z-index:6;width:max(100%,200px);
  font-size:11.5px;line-height:1.4;color:var(--bad);
  background:#FEF4F3;border:1px solid #E5BEBA;border-radius:3px;padding:6px 8px;
}
.rec-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-bottom:1px}
.rec-acts .lh{font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)}
.nudge{display:flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:#fff}
.nudge button{width:32px;height:34px;font-size:9px;color:var(--slate);display:grid;place-items:center}
.nudge button+button{border-left:1px solid var(--rule)}
.nudge button:hover:not(:disabled){background:var(--signal);color:var(--ink)}
.nudge button:disabled{color:var(--rule);cursor:not-allowed}
.rec-acts .add-btn{padding:9px 13px}

/* ---------- KSAB ---------- */
.ks-row{display:grid;grid-template-columns:auto 74px 1fr auto;gap:11px;align-items:start;padding:9px 0;border-top:1px solid var(--rule-2)}
.ks-row:first-of-type{border-top:none}
.ks-id{font-family:var(--m);font-size:11px;color:var(--slate-2);padding-top:9px;width:34px}
.ks-row select{padding:8px 6px;font-family:var(--m);font-size:11px;font-weight:600}
.ks-K{color:var(--K)} .ks-S{color:var(--S)} .ks-A{color:var(--A)} .ks-B{color:var(--B)}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--m);font-size:10.5px;font-weight:500;
  padding:4px 8px;border-radius:2px;border:1px solid;background:#fff;
}
.chip.K{color:var(--K);border-color:#B9CFE2}.chip.K.fill{background:#EAF2F8}
.chip.S{color:var(--S);border-color:#AED5CE}.chip.S.fill{background:#E7F4F1}
.chip.A{color:var(--A);border-color:#E0C79E}.chip.A.fill{background:#FAF1E3}
.chip.B{color:var(--B);border-color:#CFB7D4}.chip.B.fill{background:#F5EDF6}
.chip.off{opacity:.42;filter:grayscale(.6)}
.chip-btn{cursor:pointer}
.chip-btn:hover{box-shadow:0 0 0 2px rgba(20,22,26,.12)}
.balance{display:flex;gap:3px;height:7px;border-radius:2px;overflow:hidden;background:var(--rule-2);margin-top:2px}
.balance i{display:block}
.icon-btn{width:28px;height:28px;border-radius:3px;color:var(--slate-2);display:grid;place-items:center;font-size:16px;line-height:1;margin-top:5px}
.icon-btn:hover{background:#FBE3E1;color:var(--bad)}
.add-btn{
  font-family:var(--m);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px dashed var(--rule);border-radius:3px;padding:8px 12px;color:var(--slate);
}
.add-btn:hover{border-color:var(--ink);color:var(--ink);background:var(--card-2)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---------- rubric & activities ---------- */
.list-row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:6px 0}
.list-row .n{font-family:var(--m);font-size:10.5px;color:var(--slate-2)}
.act{border:1px solid var(--rule-2);border-radius:3px;padding:13px;margin-bottom:11px;background:var(--card-2)}
.act-top{display:grid;grid-template-columns:1fr 170px 92px auto;gap:11px;align-items:center}
@media(max-width:760px){.act-top{grid-template-columns:1fr}}
.targets{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;align-items:center}
.targets .lh{font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-right:3px}

/* ---------- trace ---------- */
.trace-wrap{position:relative}
.trace-svg{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.trace-wrap{isolation:isolate}
.tblock{background:var(--card);border:1px solid var(--rule);border-radius:4px;margin-bottom:var(--sp)}
.tblock-h{padding:14px 18px;border-bottom:1px solid var(--rule-2);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.tblock-h .id{font-family:var(--m);font-size:11px;color:var(--slate-2)}
.tblock-h h4{font-family:var(--d);font-size:15px;font-weight:700}
.lanes{display:grid;grid-template-columns:minmax(210px,1fr) minmax(190px,.85fr) minmax(210px,1fr);gap:0}
@media(max-width:900px){.lanes{grid-template-columns:1fr}}
.lane{padding:15px 18px;border-left:1px solid var(--rule-2);min-width:0}
.lane:first-child{border-left:none}
.lane-h{font-family:var(--m);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:11px;display:flex;gap:7px;align-items:center}
.node{
  position:relative;z-index:2;background:#fff;border:1px solid var(--rule-2);border-radius:3px;
  padding:8px 10px;margin-bottom:7px;font-size:12.5px;line-height:1.4;cursor:default;
}
.node .nid{font-family:var(--m);font-size:10px;color:var(--slate-2);margin-right:6px}
.node.ks{border-left:3px solid}
.node.ks.K{border-left-color:var(--K)}.node.ks.S{border-left-color:var(--S)}
.node.ks.A{border-left-color:var(--A)}.node.ks.B{border-left-color:var(--B)}
.node.orphan{border-color:var(--bad);background:#FEF4F3}
.node.asmt{background:var(--ink);color:#fff;border-color:var(--ink)}
.node.asmt .nid{color:var(--signal)}
.node.asmt .meta{font-family:var(--m);font-size:10px;color:#9AA3AB;margin-top:5px;display:block}
.node.dim{opacity:.24}
.node.hot{box-shadow:0 0 0 2px var(--signal);border-color:var(--signal-dim)}
.trace-hint{font-size:12.5px;color:var(--slate);margin:-4px 0 14px;max-width:74ch}
.thr{position:relative;z-index:2;background:#fff;border-radius:2px;padding:7px 8px;margin-top:9px;font-size:11.5px;color:var(--slate);line-height:1.5}
.legend{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.legend span{display:flex;align-items:center;gap:7px;font-family:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate)}
.legend i{display:block;width:28px;height:2px;background:var(--ink);opacity:.55;border-radius:1px}
.legend i.act{background:repeating-linear-gradient(90deg,var(--S) 0 4px,transparent 4px 8px);opacity:.75}
.legend i.orph{width:12px;height:12px;background:#FEF4F3;border:1px solid var(--bad);border-radius:2px;opacity:1}

/* ---------- quality ---------- */
.q-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:var(--sp)}
.q-el{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:14px 15px;display:flex;gap:12px;align-items:flex-start}
.q-el .num{font-family:var(--d);font-size:24px;font-weight:800;line-height:1;color:var(--rule);flex:none;width:30px}
.q-el.hit .num{color:var(--ink)}
.q-el h4{font-size:12.5px;font-weight:600;line-height:1.3;letter-spacing:0}
.q-el .st{font-family:var(--m);font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;display:block}
.st.pass{color:var(--ok)} .st.flag{color:var(--bad)} .st.soft{color:var(--warn)} .st.na{color:var(--slate-2)}
.f-row{display:grid;grid-template-columns:88px 76px 1fr;gap:14px;padding:12px 18px;border-top:1px solid var(--rule-2);align-items:start;font-size:13.5px}
.f-row:first-child{border-top:none}
.f-row .sev{font-family:var(--m);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.sev.error{color:var(--bad)} .sev.warn{color:var(--warn)} .sev.info{color:var(--slate-2)}
.f-row .loc{font-family:var(--m);font-size:11px;color:var(--K);text-align:left}
.f-row .loc:hover{text-decoration:underline}
.f-row .msg small{display:block;color:var(--slate);font-size:11.5px;margin-top:3px}
.empty{padding:34px 18px;text-align:center;color:var(--slate);font-size:13.5px}
.empty strong{display:block;font-family:var(--d);font-size:15px;color:var(--ink);margin-bottom:5px}

/* ---------- export ---------- */
.ex-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:var(--sp)}
.btn{
  font-family:var(--d);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:11px 17px;border-radius:3px;background:var(--ink);color:#fff;border:1px solid var(--ink);
}
.btn:hover{background:var(--ink-3)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{background:var(--card-2);border-color:var(--ink)}
.btn.danger{background:#fff;color:var(--bad);border-color:#E5BEBA}
.btn.danger:hover{background:#FEF4F3}
pre.out{
  background:var(--ink);color:#DDE3E8;border-radius:4px;padding:20px;overflow:auto;max-height:620px;
  font-family:var(--m);font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
}
.saved{font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--slate-2)}
.notice{background:#FFF8E2;border:1px solid #F0DCA0;border-radius:3px;padding:11px 14px;font-size:12.5px;margin-bottom:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--signal-dim);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:900px){.build{grid-template-columns:1fr}.tree{position:static;max-height:none}}
@media(max-width:760px){.band-in{grid-template-columns:1fr;gap:14px}.band h2{font-size:19px}}
html{overflow-x:hidden}
.chrome-in,.band-in,.tabs-in,main{width:100%}
</style>
</head>
<body>

<header class="chrome">
  <div class="chrome-in">
    <div class="brand">
      <span class="mark"></span>
      <div>
        <h1>Competency Architect</h1>
        <p>WSU Tech · Wichita, Kansas · C-BEN aligned</p>
      </div>
    </div>
    <div class="seg" id="discSeg" role="group" aria-label="Discipline"></div>
    <div class="track-wrap" id="trackWrap" hidden>
      <span class="lbl">Track</span>
      <div class="seg sm" id="trackSeg" role="group" aria-label="Track"></div>
    </div>
  </div>
</header>

<div class="band"><div class="band-in" id="band"></div></div>

<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>

<main id="main"></main>

<script>
/* ===== C-BEN Elements of Quality (2017 Quality Framework) ===== */
const CBEN = {
  1: "Demonstrated Institutional Commitment to and Capacity for CBE Innovation",
  2: "Clear, Measurable, Meaningful and Integrated Competencies",
  3: "Coherent, Competency-Driven Program and Curriculum Design",
  4: "Credential-Level Assessment Strategy with Robust Implementation",
  5: "Intentionally Designed and Engaged Student Experience",
  6: "Collaborative Engagement with External Partners",
  7: "Transparency of Student Learning",
  8: "Evidence-Driven Continuous Improvement Processes"
};

const KTYPE = {
  K: { label: "Knowledge", hint: "What the learner must know — theory, principles, regulation" },
  S: { label: "Skill",     hint: "What the learner must do — a discrete, trainable technique" },
  A: { label: "Ability",   hint: "Applied capacity — transfer of skill into varied, unrehearsed contexts" },

/* ============================================================ STATE */
const VAGUE = ["understand","know","learn","appreciate","be familiar","comprehend","be aware","grasp","study","review","become","gain","have knowledge"];
const clone = o => JSON.parse(JSON.stringify(o));

const state = {
  disc: "rn",
  track: "ice",
  view: "build",
  sel: { type: "comp", id: "C1.1" },
  data: {},
  dirty: false
};

/* ---- persistence (falls back to memory if storage is unavailable) ---- */
const KEY = d => "cba:v2:" + d;
let saveTimer = null;

async function load(disc){
  try{
    const r = await window.storage.get(KEY(disc));
    if (r && r.value) return JSON.parse(r.value);
  }catch(e){ /* no saved copy */ }
  return clone(SEED[disc]);
}
function scheduleSave(){
  state.dirty = true; paintSaved("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      await window.storage.set(KEY(state.disc), JSON.stringify(state.data));
      state.dirty = false; paintSaved("Saved");
    }catch(e){ paintSaved("Session only"); }
  }, 700);
}
function paintSaved(t){ document.querySelectorAll(".saved").forEach(n=>n.textContent = t); }

/* ---- derived ---- */
const D = () => state.data;
function comps(){
  const t = D().tracks ? state.track : null;
  return D().competencies.filter(c => !t || !c.track || c.track === "both" || c.track === t);
}
function compsIn(domId){ return comps().filter(c => c.domain === domId); }
function domains(){ return D().domains.filter(d => compsIn(d.id).length > 0 || !D().tracks); }
function findComp(id){ return D().competencies.find(c => c.id === id); }
function findDom(id){ return D().domains.find(d => d.id === id); }
function selComp(){ return state.sel.type === "comp" ? findComp(state.sel.id) : null; }
function nextId(list, prefix){
  let n = 1; const ids = new Set(list.map(x=>x.id));
  while (ids.has(prefix + n)) n++;
  return prefix + n;
}
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

/* ============================================================ QUALITY */
function audit(){
  const out = [];
  const push = (sev, cben, loc, locId, msg, why) => out.push({sev, cben, loc, locId, msg, why});
  const cs = comps();

  for (const d of domains()){
    const n = compsIn(d.id).length;
    if (n < 2) push("info", 3, d.id, d.id, `Domain "${d.title}" holds ${n} competenc${n===1?"y":"ies"}.`,
      "A domain with a single competency is usually a competency in disguise, or a domain that has not been fully mapped yet.");
    if (!d.cben || !d.cben.length) push("info", 3, d.id, d.id, `Domain "${d.title}" is not tagged to a C-BEN element.`, "");
    const authentic = compsIn(d.id).some(c => ["Supervised Workplace","Independent Workplace"].includes(c.assessment.authenticity));
    if (n && !authentic) push("warn", 4, d.id, d.id, `No competency in "${d.title}" is assessed in a real workplace setting.`,
      "Element 4 expects authentic assessment. Simulation and lab evidence alone leaves mastery unverified in the setting the credential claims to prepare for.");
  }

  for (const c of cs){
    const v = (c.verb||"").toLowerCase().trim();
    if (!v) push("error", 2, c.id, c.id, "Competency has no action verb.", "");
    else if (VAGUE.some(x => v.startsWith(x)))
      push("error", 2, c.id, c.id, `Verb "${c.verb}" is not observable.`,
        "Element 2 requires competencies that can be reliably and validly assessed. An unobservable verb cannot anchor a rubric — replace it with the action an assessor would actually watch.");
    if (!(c.context||"").trim()) push("error", 2, c.id, c.id, "Competency statement has no context or condition.",
      "Without a stated context, the same statement can be satisfied in a classroom or on a live aircraft. Context sets the difficulty.");
    if (!(c.criteria||"").trim()) push("error", 2, c.id, c.id, "Competency statement has no performance criteria.",
      "Criteria are the difference between an outcome and a competency — they state how well, how often, and how independently.");
    else if (!/\d|%|\ball\b|\bevery\b|\bzero\b|\bno\b|\bnone\b|\beach\b|at least|within|without|unprompted|independent|consecutive|minimum|\bone\b|\btwo\b|\bthree\b|\bfour\b|\bfive\b|\bsix\b|\bseven\b|\beight\b|\bnine\b|\bten\b/i.test(c.criteria))
      push("warn", 2, c.id, c.id, "Performance criteria may not be measurable.",
        "Criteria that contain no quantity, frequency, tolerance, or independence condition are hard to score consistently across assessors.");
    if (!(c.definition||"").trim()) push("warn", 7, c.id, c.id, "Competency has no definition for learners.",
      "Element 7 turns on learners being able to read and understand what mastery means before they attempt it.");
    if (!c.validated) push("warn", 6, c.id, c.id, "Not validated by an external partner.",
      "Element 6 expects employers and professional bodies to validate competencies, not merely advise on them.");

    const ks = c.ksabs || [];
    if (!ks.length) push("error", 2, c.id, c.id, "Competency has no KSABs.", "");
    const types = new Set(ks.map(k=>k.type));
    if (ks.length && !types.has("B")) push("warn", 2, c.id, c.id, "No behavior (B) component.",
      "Element 2 asks for integrated competencies. A competency built only from knowledge and skill omits the professional conduct employers report as the most common gap.");
    if (ks.length && !types.has("A")) push("info", 2, c.id, c.id, "No ability (A) component — no stated transfer.",
      "Ability is where a skill becomes usable in an unrehearsed situation. Without one, the competency may only be assessable on rehearsed tasks.");

    const covered = new Set(c.assessment.covers || []);
    const targeted = new Set((c.activities||[]).flatMap(a => a.targets || []));
    for (const k of ks){
      if (!covered.has(k.id)) push("error", 4, c.id + " " + k.id, c.id, `${k.id} is never assessed.`,
        "Element 4 requires the assessment strategy to cover the competency. An unassessed KSAB is a claim the credential cannot support.");
      if (!targeted.has(k.id)) push("warn", 3, c.id + " " + k.id, c.id, `${k.id} has no learning activity.`,
        "Element 3 expects every competency to connect to content and activities designed to develop it. An unsupported KSAB asks learners to arrive already competent.");
    }
    for (const id of covered) if (!ks.some(k=>k.id===id))
      push("info", 4, c.id, c.id, `Assessment references ${id}, which no longer exists.`, "");

    const a = c.assessment;
    if (!a.rubric || a.rubric.length < 2) push("warn", 4, c.id, c.id, "Rubric has fewer than two criteria.",
      "A single-row rubric collapses to pass/fail and gives learners nothing to act on when they do not pass.");
    if (!(a.threshold||"").trim()) push("error", 4, c.id, c.id, "No mastery threshold defined.",
      "Mastery has to be stated as a standard, not left to assessor judgement, or the same performance passes with one instructor and fails with another.");
    if (a.mode === "Formative") push("warn", 4, c.id, c.id, "Only formative evidence — no summative validation.",
      "Formative assessment informs the learning journey; something has to validate mastery before the credential is awarded.");
    if (!(c.activities||[]).length) push("error", 3, c.id, c.id, "Competency has no learning activities.", "");
  }

  const all = cs.flatMap(c=>c.ksabs||[]);
  if (all.length){
    for (const t of ["K","S","A","B"]){
      const pct = all.filter(k=>k.type===t).length / all.length;
      if (pct < 0.08) push("info", 2, "PROGRAM", null,
        `${KTYPE[t].label} makes up ${Math.round(pct*100)}% of all KSABs across the program.`,
        "A framework weighted heavily toward one type usually reflects how it was written rather than what the occupation requires.");
    }
  }
  const order = {error:0, warn:1, info:2};
  out.sort((a,b)=> order[a.sev]-order[b.sev] || a.cben-b.cben || String(a.loc).localeCompare(String(b.loc)));
  return out;
}

/* ============================================================ SHELL */

function renderTabs(){
  const flags = audit().filter(f=>f.sev==="error").length;
  const t = [["build","Build"],["trace","Alignment trace"],["quality","Quality check"],["export","Export"]];
  const el = document.getElementById("tabs");
  el.innerHTML = t.map(([k,l]) =>
    `<button data-v="${k}" aria-pressed="${state.view===k}">${l}${
      k==="quality" ? `<span class="count${flags?" flag":""}">${flags}</span>` : ""}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { state.view = b.dataset.v; renderTabs(); renderMain(); window.scrollTo({top:0}); });
}

function renderAll(){ renderChrome(); renderTabs(); renderMain(); }
function renderMain(){
  const m = document.getElementById("main");
  if (state.view === "build") renderBuild(m);
  else if (state.view === "trace") renderTrace(m);
  else if (state.view === "quality") renderQuality(m);
  else renderExport(m);
}

async function switchDisc(k){
  clearTimeout(saveTimer);
  if (state.dirty){ try{ await window.storage.set(KEY(state.disc), JSON.stringify(state.data)); }catch(e){} state.dirty=false; }
  state.disc = k;
  state.data = await load(k);
  state.track = D().tracks ? D().tracks[0].id : "ice";
  state.sel = { type:"comp", id: comps()[0]?.id };
  renderAll();
}

/* ============================================================ BUILD */
function renderBuild(root){
  root.innerHTML = `<div class="build"><aside class="tree" id="tree"></aside><div class="panel" id="panel"></div></div>`;
  renderTree(); renderPanel();
}

function renderTree(){
  const errs = {};
  audit().filter(f=>f.sev==="error").forEach(f => { if (f.locId) errs[f.locId] = true; });
  const html = domains().map(d => {
    const on = state.sel.type==="dom" && state.sel.id===d.id;
    return `<div class="dom">
      <button class="dom-btn${on?" on":""}" data-dom="${d.id}">
        <span class="id">${d.id}</span><span class="nm">${esc(d.title)}</span>
      </button>
      ${compsIn(d.id).map(c => `
        <button class="comp-btn${state.sel.type==="comp"&&state.sel.id===c.id?" on":""}" data-comp="${c.id}">
          <span class="id">${c.id}</span>
          <span class="nm${(c.verb||c.object)?"":" untitled"}">${esc(compLabel(c))}</span>
          ${errs[c.id]?'<span class="dot" title="Quality check errors"></span>':""}
        </button>`).join("")}
      <button class="comp-add" data-addcomp="${d.id}" title="Add a competency to ${esc(d.title)}">+ Competency</button>
    </div>`;
  }).join("");

  document.getElementById("tree").innerHTML = `
    <div class="tree-h"><span class="t">Framework</span><span class="t">${comps().length} comp.</span></div>
    ${html}
    <button class="tree-add" data-add="dom">+ Add domain</button>`;

  const t = document.getElementById("tree");
  t.querySelectorAll("[data-dom]").forEach(b => b.onclick = () => { state.sel={type:"dom",id:b.dataset.dom}; renderTree(); renderPanel(); });
  t.querySelectorAll("[data-comp]").forEach(b => b.onclick = () => { state.sel={type:"comp",id:b.dataset.comp}; renderTree(); renderPanel(); });
  t.querySelectorAll("[data-addcomp]").forEach(b => b.onclick = () => addCompetency(b.dataset.addcomp));
  t.querySelector("[data-add=dom]").onclick = () => {
    const d = { id: nextId(D().domains,"D"), title:"New domain", rationale:"", cben:[2] };
    D().domains.push(d); state.sel={type:"dom",id:d.id}; scheduleSave(); renderChrome(); renderTree(); renderPanel();
  };
}

function renameCompetency(c, raw){
  const id = String(raw).trim().replace(/\s+/g,"");
  if (!id) return { ok:false, msg:"An identifier can't be blank." };
  if (id === c.id) return { ok:true };
  if (!/^[A-Za-z0-9][A-Za-z0-9._-]*$/.test(id))
    return { ok:false, msg:"Use letters, digits, dots, dashes or underscores — no spaces." };
  if (D().competencies.some(x => x.id === id))
    return { ok:false, msg:`${id} is already used by another competency.` };
  c.id = id; state.sel = { type:"comp", id };
  return { ok:true };
}

function moveCompetency(c, dir){
  const sibs = compsIn(c.domain);
  const i = sibs.indexOf(c), j = i + dir;
  if (i < 0 || j < 0 || j >= sibs.length) return;
  const all = D().competencies;
  const a = all.indexOf(c), b = all.indexOf(sibs[j]);
  all[a] = sibs[j]; all[b] = c;
  scheduleSave(); renderTree(); renderPanel();
}

function reassignCompetency(c, domId){
  if (domId === c.domain) return;
  const all = D().competencies;
  all.splice(all.indexOf(c), 1);
  c.domain = domId;
  const sibs = all.filter(x => x.domain === domId);
  const at = sibs.length ? all.indexOf(sibs[sibs.length-1]) + 1 : all.length;
  all.splice(at, 0, c);
  scheduleSave(); renderChrome(); renderTree(); renderPanel();
}

function duplicateCompetency(c){
  const copy = clone(c);
  let n = 2, id = c.id + "-copy";
  while (D().competencies.some(x => x.id === id)) id = c.id + "-copy" + (n++);
  copy.id = id;
  copy.validated = false; copy.validatedBy = "";
  const all = D().competencies;
  all.splice(all.indexOf(c) + 1, 0, copy);
  state.sel = { type:"comp", id };
  scheduleSave(); renderChrome(); renderTree(); renderPanel();
  document.getElementById("sId")?.select();
}

function addCompetency(domId){
  const dom = findDom(domId); if (!dom) return;
  const n = D().competencies.filter(x => x.domain === domId).length + 1;
  let id = domId.replace("D","C") + "." + n;
  let k = n; while (D().competencies.some(x => x.id === id)) id = domId.replace("D","C") + "." + (++k);
  const c = {
    id, domain: domId,
    track: D().tracks ? (state.track || "both") : null,
    level: "Applying", validated: false, validatedBy: "",
    verb: "", object: "", context: "", criteria: "", definition: "",
    ksabs: [],
    assessment: { evidence:"Performance", mode:"Summative", authenticity:"Lab / Shop", threshold:"", rubric:[], covers:[] },
    activities: []
  };
  D().competencies.push(c);
  state.sel = { type:"comp", id: c.id };
  scheduleSave(); renderChrome(); renderTree(); renderPanel();
  document.getElementById("sVerb")?.focus();
}

const cbenTag = n => `<span class="cben-tag" title="${esc(CBEN[n])}">C-BEN ${n}</span>`;
function flashError(el, msg){
  const prev = el.parentElement.querySelector(".ferr");
  if (prev) prev.remove();
  const n = document.createElement("span");
  n.className = "ferr"; n.textContent = msg; n.setAttribute("role","status");
  el.parentElement.appendChild(n);
  el.classList.add("bad");
  setTimeout(() => { n.remove(); el.classList.remove("bad"); }, 3600);
}

const compLabel = c => (c.verb || c.object) ? `${c.verb} ${c.object}`.trim() : "Untitled competency";
const opts = (arr, v) => arr.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("");

function renderPanel(){
  const p = document.getElementById("panel");
  if (state.sel.type === "dom") return renderDomPanel(p);
  const c = selComp();
  if (!c){ p.innerHTML = `<div class="card"><div class="empty"><strong>Nothing selected</strong>Pick a competency from the framework, or add one.</div></div>`; return; }

  p.innerHTML = statementCard(c) + ksabCard(c) + assessCard(c) + activityCard(c);
  wireStatement(c); wireKsab(c); wireAssess(c); wireActivity(c);
}

function renderDomPanel(p){
  const d = findDom(state.sel.id);
  p.innerHTML = `
  <section class="card">
    <div class="card-h"><span class="bar"></span><h3>Domain of learning</h3><span class="sub">${d.id} · ${compsIn(d.id).length} competencies</span></div>
    <div class="card-b">
      <label class="f" style="margin-bottom:14px"><span class="lh">Title</span>
        <input type="text" id="dTitle" value="${esc(d.title)}"></label>
      <label class="f" style="margin-bottom:14px"><span class="lh">Rationale — why this is a domain of this credential</span>
        <textarea id="dRat">${esc(d.rationale)}</textarea></label>
      <span class="lh" style="font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);display:block;margin-bottom:7px">C-BEN elements this domain answers to</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${Object.keys(CBEN).map(n=>`<button class="chip chip-btn K${d.cben.includes(+n)?" fill":" off"}" data-cben="${n}" title="${esc(CBEN[n])}">${n}</button>`).join("")}
      </div>
      <div class="row-actions">
        <button class="add-btn" id="addComp">+ Add competency to this domain</button>
        <button class="add-btn" id="delDom" style="color:var(--bad);border-color:#E5BEBA">Delete domain</button>
      </div>
    </div>
  </section>`;

  document.getElementById("dTitle").oninput = e => { d.title = e.target.value; scheduleSave(); renderTree(); };
  document.getElementById("dRat").oninput = e => { d.rationale = e.target.value; scheduleSave(); };
  p.querySelectorAll("[data-cben]").forEach(b => b.onclick = () => {
    const n = +b.dataset.cben; const i = d.cben.indexOf(n);
    i>=0 ? d.cben.splice(i,1) : d.cben.push(n); d.cben.sort();
    scheduleSave(); renderDomPanel(p);
  });
  document.getElementById("addComp").onclick = () => addCompetency(d.id);
  document.getElementById("delDom").onclick = () => {
    if (!confirm(`Delete domain "${d.title}" and its ${compsIn(d.id).length} competencies?`)) return;
    D().competencies = D().competencies.filter(c => c.domain !== d.id);
    D().domains = D().domains.filter(x => x.id !== d.id);
    state.sel = { type:"comp", id: comps()[0]?.id };
    scheduleSave(); renderChrome(); renderTree(); renderPanel();
  };
}

/* ---- statement ---- */
function statementCard(c){
  const dom = findDom(c.domain);
  const sibs = compsIn(c.domain);
  const pos = { i: sibs.indexOf(c), n: sibs.length };
  return `
  <section class="card">
    <div class="card-h">
      <span class="bar"></span><h3>Competency statement</h3>
      ${cbenTag(2)}${cbenTag(7)}
      <span class="sub">${c.id} · ${esc(dom?dom.title:"—")}${pos.n>1?` · ${pos.i+1} of ${pos.n}`:""}</span>
    </div>
    <div class="rec">
      <label class="f"><span class="lh">Identifier</span>
        <input type="text" id="sId" value="${esc(c.id)}" spellcheck="false" autocomplete="off"></label>
      <label class="f"><span class="lh">Domain</span>
        <select id="sDom">${D().domains.map(x=>`<option value="${x.id}"${x.id===c.domain?" selected":""}>${x.id} — ${esc(x.title)}</option>`).join("")}</select></label>
      <div class="rec-acts">
        <span class="lh">Order in domain</span>
        <div class="nudge">
          <button id="sUp" ${pos.i<=0?"disabled":""} title="Move up" aria-label="Move up">&#9650;</button>
          <button id="sDown" ${pos.i>=pos.n-1?"disabled":""} title="Move down" aria-label="Move down">&#9660;</button>
        </div>
        <button class="add-btn" id="sDup" title="Copy this competency as a starting point">Duplicate</button>
      </div>
    </div>
    <div class="card-b">
      <div class="stmt-grid">
        <label class="f"><span class="lh">Action verb</span><input type="text" id="sVerb" value="${esc(c.verb)}" placeholder="Diagnose"></label>
        <label class="f"><span class="lh">Object of performance</span><input type="text" id="sObj" value="${esc(c.object)}" placeholder="what is acted on"></label>
        <span class="lh" style="padding-top:9px;font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)">Context</span>
        <textarea id="sCtx" placeholder="where, with what, under what conditions">${esc(c.context)}</textarea>
        <span class="lh" style="padding-top:9px;font-family:var(--m);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate)">Criteria</span>
        <textarea id="sCrit" placeholder="how well, how often, how independently">${esc(c.criteria)}</textarea>
      </div>
      <div class="readout"><span class="rh">Assembled statement</span><span id="sOut">${stmtHtml(c)}</span></div>
      <div style="margin-top:16px" class="grid4">
        <label class="f"><span class="lh">Cognitive level</span><select id="sLvl">${opts(LEVELS,c.level)}</select></label>
        ${D().tracks ? `<label class="f"><span class="lh">Track</span><select id="sTrk">
          <option value="both"${c.track==="both"?" selected":""}>Both tracks</option>
          ${D().tracks.map(t=>`<option value="${t.id}"${c.track===t.id?" selected":""}>${esc(t.label)} only</option>`).join("")}
        </select></label>` : ""}
        <label class="f"><span class="lh">Externally validated</span><select id="sVal">
          <option value="1"${c.validated?" selected":""}>Yes</option><option value="0"${!c.validated?" selected":""}>Not yet</option></select></label>
        <label class="f"><span class="lh">Validated by</span><input type="text" id="sValBy" value="${esc(c.validatedBy)}" placeholder="partner, date"></label>
      </div>
      <label class="f" style="margin-top:14px"><span class="lh">Definition shown to learners</span>
        <textarea id="sDef">${esc(c.definition)}</textarea></label>
      <div class="row-actions">
        <button class="add-btn" id="delComp" style="color:var(--bad);border-color:#E5BEBA">Delete competency</button>
      </div>
    </div>
  </section>`;
}
function stmtHtml(c){
  if (!c.verb && !c.object) return `<em style="color:#78818A">Fill the four parts above and the statement assembles here.</em>`;
  return `<span class="v">${esc(c.verb)}</span> ${esc(c.object)}${c.context?`, <span class="c">${esc(c.context)}</span>`:""}${c.criteria?`, <span class="cr">${esc(c.criteria)}</span>`:""}.`;
}
function wireStatement(c){
  const live = () => { document.getElementById("sOut").innerHTML = stmtHtml(c); scheduleSave(); };
  const bind = (id, k, after) => { const e = document.getElementById(id); if(!e) return;
    e.oninput = ev => { c[k] = ev.target.value; live(); if (after) after(); }; };
  bind("sVerb","verb",()=>renderTree()); bind("sObj","object",()=>renderTree());
  bind("sCtx","context"); bind("sCrit","criteria");
  document.getElementById("sDef").oninput = e => { c.definition = e.target.value; scheduleSave(); };
  document.getElementById("sLvl").onchange = e => { c.level = e.target.value; scheduleSave(); };
  document.getElementById("sVal").onchange = e => { c.validated = e.target.value === "1"; scheduleSave(); };
  document.getElementById("sValBy").oninput = e => { c.validatedBy = e.target.value; scheduleSave(); };
  const tk = document.getElementById("sTrk");
  if (tk) tk.onchange = e => { c.track = e.target.value; scheduleSave(); renderChrome(); renderTree(); };
  const idBox = document.getElementById("sId");
  idBox.onchange = e => {
    const r = renameCompetency(c, e.target.value);
    if (!r.ok){ e.target.value = c.id; flashError(e.target, r.msg); return; }
    scheduleSave(); renderTree(); renderPanel();
  };
  idBox.onkeydown = e => { if (e.key === "Enter") e.target.blur(); };
  document.getElementById("sDom").onchange = e => reassignCompetency(c, e.target.value);
  document.getElementById("sUp").onclick = () => moveCompetency(c, -1);
  document.getElementById("sDown").onclick = () => moveCompetency(c, 1);
  document.getElementById("sDup").onclick = () => duplicateCompetency(c);
  document.getElementById("delComp").onclick = () => {
    if (!confirm(`Delete competency ${c.id}?`)) return;
    D().competencies = D().competencies.filter(x=>x.id!==c.id);
    state.sel = { type:"comp", id: comps()[0]?.id };
    scheduleSave(); renderChrome(); renderTree(); renderPanel();
  };
}

/* ---- KSAB ---- */
function ksabCard(c){
  const ks = c.ksabs || [];
  const counts = { K:0,S:0,A:0,B:0 }; ks.forEach(k=>counts[k.type]++);
  const tot = ks.length || 1;
  const covered = new Set(c.assessment.covers||[]);
  const targeted = new Set((c.activities||[]).flatMap(a=>a.targets||[]));
  return `
  <section class="card">
    <div class="card-h">
      <span class="bar"></span><h3>Knowledge · Skills · Abilities · Behaviors</h3>${cbenTag(2)}
      <span class="sub">${ks.length} components</span>
    </div>
    <div class="card-b">
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:16px">
        ${["K","S","A","B"].map(t=>`<span class="chip ${t} fill" title="${esc(KTYPE[t].hint)}">${t} · ${KTYPE[t].label} <b style="font-family:var(--m)">${counts[t]}</b></span>`).join("")}
        <div style="flex:1;min-width:130px">
          <div class="balance">${["K","S","A","B"].map(t=>`<i style="width:${counts[t]/tot*100}%;background:var(--${t})"></i>`).join("")}</div>
        </div>
      </div>
      <div id="ksList">
      ${ks.map(k=>`
        <div class="ks-row" data-k="${k.id}">
          <span class="ks-id">${k.id}</span>
          <select class="ks-${k.type}" data-f="type">${["K","S","A","B"].map(t=>`<option value="${t}"${k.type===t?" selected":""}>${t}</option>`).join("")}</select>
          <div>
            <input type="text" data-f="text" value="${esc(k.text)}">
            <div style="display:flex;gap:7px;margin-top:6px;font-family:var(--m);font-size:10px;letter-spacing:.06em">
              <span style="color:${covered.has(k.id)?"var(--ok)":"var(--bad)"}">${covered.has(k.id)?"assessed":"not assessed"}</span>
              <span style="color:var(--rule)">|</span>
              <span style="color:${targeted.has(k.id)?"var(--ok)":"var(--warn)"}">${targeted.has(k.id)?"taught":"no activity"}</span>
            </div>
          </div>
          <button class="icon-btn" data-del="${k.id}" title="Remove ${k.id}">×</button>
        </div>`).join("") || `<p style="color:var(--slate);font-size:13px;margin:0 0 6px">No components yet. Decompose the competency into what a graduate must know, do, transfer, and habitually demonstrate.</p>`}
      </div>
      <div class="row-actions">
        ${["K","S","A","B"].map(t=>`<button class="add-btn" data-add="${t}">+ ${KTYPE[t].label}</button>`).join("")}
      </div>
    </div>
  </section>`;
}
function wireKsab(c){
  const list = document.getElementById("ksList");
  list.querySelectorAll(".ks-row").forEach(row => {
    const k = c.ksabs.find(x=>x.id===row.dataset.k);
    row.querySelector("[data-f=type]").onchange = e => {
      const nid = nextId(c.ksabs.filter(x=>x.id!==k.id), e.target.value);
      const old = k.id; k.type = e.target.value; k.id = nid;
      const cv = c.assessment.covers; const i = cv.indexOf(old); if (i>=0) cv[i] = nid;
      (c.activities||[]).forEach(a => { const j = (a.targets||[]).indexOf(old); if (j>=0) a.targets[j] = nid; });
      scheduleSave(); renderPanel();
    };
    row.querySelector("[data-f=text]").oninput = e => { k.text = e.target.value; scheduleSave(); };
    row.querySelector("[data-del]").onclick = () => {
      c.ksabs = c.ksabs.filter(x=>x.id!==k.id);
      c.assessment.covers = c.assessment.covers.filter(x=>x!==k.id);
      (c.activities||[]).forEach(a => a.targets = (a.targets||[]).filter(x=>x!==k.id));
      scheduleSave(); renderChrome(); renderPanel();
    };
  });
  document.querySelectorAll("[data-add]").forEach(b => {
    if (!["K","S","A","B"].includes(b.dataset.add)) return;

/* ============================================================ TRACE */
function renderTrace(root){
  const cs = comps();
  root.innerHTML = `
    <p class="trace-hint">Every line is an alignment claim. A KSAB with no line to the assessment is not being measured; a KSAB with no line to an activity is not being taught. Hover any node to isolate its chain.</p>
    <div class="legend">
      <span><i></i> assessed by</span>
      <span><i class="act"></i> developed by</span>
      <span><i class="orph"></i> not covered by the assessment</span>
    </div>
    <div class="trace-wrap" id="tw">
      <svg class="trace-svg" id="tsvg" aria-hidden="true"></svg>
      ${cs.map(c => {
        const covered = new Set(c.assessment.covers||[]);
        const targeted = new Set((c.activities||[]).flatMap(a=>a.targets||[]));
        const dom = findDom(c.domain);
        return `<div class="tblock">
          <div class="tblock-h">
            <span class="id">${c.id}</span>
            <h4>${esc(compLabel(c))}</h4>
            <span class="cben-tag">${esc(dom?dom.title:"—")}</span>
            <span class="cben-tag">${esc(c.level)}</span>
          </div>
          <div class="lanes">
            <div class="lane">
              <div class="lane-h">KSAB components</div>
              ${(c.ksabs||[]).map(k=>{
                const orph = !covered.has(k.id);
                return `<div class="node ks ${k.type}${orph?" orphan":""}" data-node="${c.id}|${k.id}" data-kind="ks">
                  <span class="nid">${k.id}</span>${esc(k.text)}</div>`;
              }).join("") || `<div class="node orphan">No KSABs defined</div>`}
            </div>
            <div class="lane">
              <div class="lane-h">Assessment</div>
              <div class="node asmt" data-node="${c.id}|ASMT" data-kind="as">
                <span class="nid">${esc(c.assessment.mode.slice(0,4).toUpperCase())}</span>${esc(c.assessment.evidence)} evidence
                <span class="meta">${esc(c.assessment.authenticity)} · ${(c.assessment.rubric||[]).length} rubric rows</span>
              </div>
              <div class="thr">${esc(c.assessment.threshold) || "<em>No threshold set</em>"}</div>
            </div>
            <div class="lane">
              <div class="lane-h">Learning activities</div>
              ${(c.activities||[]).map(a=>`
                <div class="node" data-node="${c.id}|${a.id}" data-kind="act">
                  <span class="nid">${a.id}</span>${esc(a.title)}
                  <span class="meta" style="display:block;font-family:var(--m);font-size:10px;color:var(--slate-2);margin-top:4px">${esc(a.modality)} · ${a.hours}h</span>
                </div>`).join("") || `<div class="node orphan">No activities</div>`}
            </div>
          </div>
        </div>`;
      }).join("") || `<div class="card"><div class="empty"><strong>Nothing to trace</strong>This track has no competencies yet.</div></div>`}
    </div>`;
  requestAnimationFrame(drawLines);
  window.addEventListener("resize", debouncedDraw);
  wireTraceHover();
}
let dTimer; const debouncedDraw = () => { clearTimeout(dTimer); dTimer = setTimeout(drawLines, 120); };

function drawLines(){
  const wrap = document.getElementById("tw"); const svg = document.getElementById("tsvg");
  if (!wrap || !svg) return;
  const W = wrap.scrollWidth, H = wrap.scrollHeight;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  const base = wrap.getBoundingClientRect();
  const R = el => { const r = el.getBoundingClientRect();
    return { l:r.left-base.left+wrap.scrollLeft, t:r.top-base.top+wrap.scrollTop, w:r.width, h:r.height }; };
  const paths = [];
  for (const c of comps()){
    const covered = new Set(c.assessment.covers||[]);
    for (const k of (c.ksabs||[])){
      const from = wrap.querySelector(`[data-node="${c.id}|${k.id}"]`); if (!from) continue;
      const a = R(from);
      const link = (to, cls) => {
        const b = R(to);
        const x1=a.l+a.w, y1=a.t+a.h/2, x2=b.l, y2=b.t+b.h/2, mx=(x1+x2)/2;
        paths.push(`<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" class="${cls}" data-link="${c.id}|${k.id}"/>`);
      };
      if (covered.has(k.id)){ const as = wrap.querySelector(`[data-node="${c.id}|ASMT"]`); if (as) link(as, "l-as"); }
      for (const act of (c.activities||[])) if ((act.targets||[]).includes(k.id)){
        const el = wrap.querySelector(`[data-node="${c.id}|${act.id}"]`); if (el) link(el, "l-act");
      }
    }
  }
  svg.innerHTML = `<style>
    path{fill:none;stroke-width:1.4}
    .l-as{stroke:#14161A;opacity:.5}
    .l-act{stroke:#0F7A69;opacity:.42;stroke-dasharray:3 3}
    path.hot{stroke:#E0A800;opacity:1;stroke-width:2.4;stroke-dasharray:none}
    path.faint{opacity:.07}
  </style>` + paths.join("");
}

function wireTraceHover(){
  const wrap = document.getElementById("tw"); if (!wrap) return;
  const clear = () => {
    wrap.querySelectorAll(".node").forEach(n=>n.classList.remove("dim","hot"));
    wrap.querySelectorAll("#tsvg path").forEach(p=>p.classList.remove("hot","faint"));
  };
  wrap.querySelectorAll("[data-node]").forEach(n => {
    n.onmouseenter = () => {
      const [cid, part] = n.dataset.node.split("|");
      const c = findComp(cid); if (!c) return;

      // the set of node keys in this competency's chain, and the link keys to light up
      const nodeKeys = new Set([n.dataset.node]);
      const linkKeys = new Set();

      if (n.dataset.kind === "ks"){
        linkKeys.add(cid + "|" + part);
        if ((c.assessment.covers||[]).includes(part)) nodeKeys.add(cid + "|ASMT");
        (c.activities||[]).forEach(a => { if ((a.targets||[]).includes(part)) nodeKeys.add(cid + "|" + a.id); });
      } else {
        const keys = n.dataset.kind === "as"
          ? (c.assessment.covers || [])
          : ((c.activities.find(a=>a.id===part)||{}).targets || []);
        keys.forEach(k => { nodeKeys.add(cid + "|" + k); linkKeys.add(cid + "|" + k); });
      }

      const block = n.closest(".tblock") || wrap;
      block.querySelectorAll(".node").forEach(x => x.classList.add("dim"));
      wrap.querySelectorAll("#tsvg path").forEach(p => {
        if (String(p.dataset.link||"").startsWith(cid + "|")) p.classList.add("faint");
      });
      nodeKeys.forEach(k => {
        const el = wrap.querySelector('[data-node="' + k + '"]');
        if (el){ el.classList.remove("dim"); el.classList.add("hot"); }
      });
      wrap.querySelectorAll("#tsvg path").forEach(p => {
        if (linkKeys.has(p.dataset.link)){ p.classList.remove("faint"); p.classList.add("hot"); }
      });
    };
    n.onmouseleave = clear;
  });
}

/* ============================================================ QUALITY */
function renderQuality(root){
  const f = audit();
  const byEl = {};
  Object.keys(CBEN).forEach(n => byEl[n] = { error:0, warn:0, info:0 });
  f.forEach(x => byEl[x.cben][x.sev]++);
  const covered = new Set([2,3,4,6,7]);

  root.innerHTML = `
    <div class="notice">This panel evaluates the framework you have built against the parts of C-BEN's eight Elements of Quality that a competency map can evidence. Elements 1, 5 and 8 are institutional and programmatic — they are shown for completeness but cannot be checked from a competency map alone.</div>
    <div class="q-grid">
      ${Object.keys(CBEN).map(n=>{
        const s = byEl[n]; const inScope = covered.has(+n);
        const cls = !inScope ? "na" : s.error ? "flag" : s.warn ? "soft" : "pass";
        const txt = !inScope ? "Not machine-checkable" : s.error ? `${s.error} blocking` : s.warn ? `${s.warn} to review` : "Clear";
        return `<div class="q-el${inScope?" hit":""}">
          <span class="num">${String(n).padStart(2,"0")}</span>
          <div><h4>${esc(CBEN[n])}</h4><span class="st ${cls}">${txt}</span></div>
        </div>`;
      }).join("")}
    </div>
    <section class="card">
      <div class="card-h"><span class="bar"></span><h3>Findings</h3>
        <span class="sub">${f.filter(x=>x.sev==="error").length} blocking · ${f.filter(x=>x.sev==="warn").length} to review · ${f.filter(x=>x.sev==="info").length} notes</span></div>
      ${f.length ? f.map(x=>`
        <div class="f-row">
          <span class="sev ${x.sev}">${x.sev==="error"?"Blocking":x.sev==="warn"?"Review":"Note"} · E${x.cben}</span>
          ${x.locId ? `<button class="loc" data-go="${x.locId}">${esc(x.loc)}</button>` : `<span class="loc" style="color:var(--slate-2)">${esc(x.loc)}</span>`}
          <div class="msg">${esc(x.msg)}${x.why?`<small>${esc(x.why)}</small>`:""}</div>
        </div>`).join("")
      : `<div class="empty"><strong>Nothing flagged</strong>Every competency in this track carries measurable criteria, full KSAB coverage, and aligned activities.</div>`}
    </section>`;

  root.querySelectorAll("[data-go]").forEach(b => b.onclick = () => {
    const id = b.dataset.go;
    state.sel = { type: id.startsWith("D") && !id.includes(".") ? "dom" : "comp", id };
    state.view = "build"; renderTabs(); renderMain(); window.scrollTo({top:0});
  });
}

/* ============================================================ EXPORT */
function toMarkdown(){
  const d = D();
  const t = d.tracks ? d.tracks.find(x=>x.id===state.track) : null;
  const L = [];
  L.push(`# ${d.program}`, "");
  L.push(`**Credential:** ${d.credential}  `);
  L.push(`**Site:** ${d.site}  `);
  if (t) L.push(`**Track:** ${t.label}  `);
  L.push(`**Framework standard:** C-BEN Quality Framework for Competency-Based Education Programs  `);
  L.push(`**Generated:** ${new Date().toISOString().slice(0,10)}`, "");
  L.push(`**External frameworks:** ${d.frames.join("; ")}`, "");
  L.push(`**Validating partners:** ${d.partners.join("; ")}`, "");
  L.push("---", "");
  for (const dom of domains()){
    const cs = compsIn(dom.id); if (!cs.length) continue;
    L.push(`## ${dom.id} — ${dom.title}`, "");
    if (dom.rationale) L.push(`_${dom.rationale}_`, "");
    if (dom.cben?.length) L.push(`C-BEN elements: ${dom.cben.map(n=>`${n} (${CBEN[n]})`).join("; ")}`, "");
    for (const c of cs){
      L.push(`### ${c.id} — ${c.verb} ${c.object}`, "");
      L.push(`**Competency statement.** ${c.verb} ${c.object}${c.context?`, ${c.context}`:""}${c.criteria?`, ${c.criteria}`:""}.`, "");
      if (c.definition) L.push(`**Definition.** ${c.definition}`, "");
      L.push(`**Cognitive level:** ${c.level} · **External validation:** ${c.validated ? (c.validatedBy||"Yes") : "Not yet validated"}`, "");
      L.push(`#### KSAB components`, "");
      L.push(`| ID | Type | Component | Assessed | Taught |`, `|---|---|---|---|---|`);
      const cov = new Set(c.assessment.covers||[]), tgt = new Set((c.activities||[]).flatMap(a=>a.targets||[]));
      for (const k of c.ksabs||[])
        L.push(`| ${k.id} | ${KTYPE[k.type].label} | ${k.text.replace(/\|/g,"\\|")} | ${cov.has(k.id)?"yes":"**no**"} | ${tgt.has(k.id)?"yes":"**no**"} |`);
      L.push("");
      const a = c.assessment;
      L.push(`#### Assessment strategy`, "");
      L.push(`- **Evidence:** ${a.evidence} · **Purpose:** ${a.mode} · **Setting:** ${a.authenticity}`);
      L.push(`- **Mastery threshold:** ${a.threshold||"_not set_"}`);
      L.push(`- **Rubric criteria:**`);
      (a.rubric||[]).forEach(r => L.push(`  - ${r}`));
      if (!(a.rubric||[]).length) L.push(`  - _none defined_`);
      L.push(`- **Covers:** ${(a.covers||[]).join(", ")||"_none_"}`, "");
      L.push(`#### Learning activities`, "");
      L.push(`| ID | Activity | Modality | Hours | Develops |`, `|---|---|---|---|---|`);
      for (const act of c.activities||[])
        L.push(`| ${act.id} | ${act.title.replace(/\|/g,"\\|")} | ${act.modality} | ${act.hours} | ${(act.targets||[]).join(", ")} |`);
      if (!(c.activities||[]).length) L.push(`| — | _none defined_ | | | |`);
      L.push("");
    }
  }
  const f = audit();
  L.push("---", "", `## Quality check summary`, "");
  L.push(`${f.filter(x=>x.sev==="error").length} blocking, ${f.filter(x=>x.sev==="warn").length} to review, ${f.filter(x=>x.sev==="info").length} notes.`, "");
  for (const x of f) L.push(`- **${x.sev==="error"?"Blocking":x.sev==="warn"?"Review":"Note"}** (Element ${x.cben}) — ${x.loc}: ${x.msg}`);
  return L.join("\n");
}

function download(name, text, type){
  const b = new Blob([text], {type});
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 2000);
}

function renderExport(root){
  const md = toMarkdown();
  root.innerHTML = `
    <div class="ex-actions">
      <button class="btn" id="dlMd">Download Markdown</button>
      <button class="btn ghost" id="dlJson">Download JSON</button>
      <button class="btn ghost" id="copyMd">Copy Markdown</button>
      <label class="btn ghost" style="display:inline-flex;align-items:center">Import JSON
        <input type="file" id="imp" accept="application/json,.json" class="sr"></label>
      <button class="btn danger" id="reset">Reset this discipline to seed</button>
      <span class="saved" style="align-self:center;margin-left:auto">Saved</span>
    </div>
    <div class="notice">Markdown is the curriculum-committee artifact — paste it into a document, a proposal, or an accreditation narrative. JSON round-trips the full framework so you can hand it to a colleague, version it, or load it into another system.</div>
    <pre class="out" id="mdOut">${esc(md)}</pre>`;

  const slug = D().program.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,50);
  document.getElementById("dlMd").onclick = () => download(`${slug}-competency-framework.md`, md, "text/markdown");
  document.getElementById("dlJson").onclick = () => download(`${slug}-competency-framework.json`, JSON.stringify(D(), null, 2), "application/json");
  document.getElementById("copyMd").onclick = async e => {
    try{ await navigator.clipboard.writeText(md); e.target.textContent = "Copied"; setTimeout(()=>e.target.textContent="Copy Markdown", 1600); }
    catch(err){ const p = document.getElementById("mdOut"); const r = document.createRange(); r.selectNode(p);
      getSelection().removeAllRanges(); getSelection().addRange(r); e.target.textContent = "Selected — press Ctrl/Cmd+C"; }
  };
  document.getElementById("imp").onchange = ev => {
    const file = ev.target.files[0]; if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const j = JSON.parse(r.result);
        if (!j.domains || !j.competencies) throw new Error("shape");
        state.data = j;
        state.track = D().tracks ? D().tracks[0].id : "ice";
        state.sel = { type:"comp", id: comps()[0]?.id };
        scheduleSave(); renderAll();
      }catch(e){ alert("That file is not a competency framework export. Expecting JSON with domains and competencies."); }
    };
    r.readAsText(file);
  };
  document.getElementById("reset").onclick = async () => {
    if (!confirm(`Discard all edits to ${D().name} and restore the seeded framework?`)) return;
    try{ await window.storage.delete(KEY(state.disc)); }catch(e){}
    state.data = clone(SEED[state.disc]);
    state.track = D().tracks ? D().tracks[0].id : "ice";
    state.sel = { type:"comp", id: comps()[0]?.id };
    renderAll();
  };
}

/* ============================================================ BOOT */
(async function(){
  state.data = await load(state.disc);
  state.sel = { type:"comp", id: comps()[0]?.id };
  renderAll();
})();
